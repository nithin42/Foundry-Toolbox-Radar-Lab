name: Radar Toolbox Governance Gate

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "**.yaml"
      - "**.yml"
      - "tool/**"
      - ".github/workflows/radar-gate.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "**.yaml"
      - "**.yml"
      - "tool/**"
      - ".github/workflows/radar-gate.yml"

jobs:
  governance-gate:
    name: Audit Toolbox Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tool/requirements.txt

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Radar Test Suite
        run: |
          python -m pytest tool/tests/test_radar.py -v

      - name: Audit Clean Toolbox Fixture (Baseline)
        run: |
          radar tool/tests/fixtures/clean_toolbox.yaml --json

      - name: Verify Radar Failure on Risky Fixture
        run: |
          echo "Verifying that radar properly blocks risky configurations..."
          if radar tool/tests/fixtures/risky_toolbox.yaml --json; then
            echo "Error: radar was expected to fail on risky_toolbox.yaml, but passed!"
            exit 1
          else
            echo "Success: radar successfully caught HIGH risk findings (including RULE-07) and exited non-zero."
          fi
